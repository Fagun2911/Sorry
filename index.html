<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Darling ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#000;
overflow:hidden;
color:white;

}

video, img{
max-width:100%;
}

#login{

position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:#000;
z-index:999;

}

.login-box{

background:rgba(255,255,255,.08);
padding:40px;
border-radius:20px;
backdrop-filter:blur(20px);
text-align:center;
width:350px;
box-shadow:0 0 40px rgba(255,0,100,.4);

}

.login-box h1{

font-family:"Great Vibes";
font-size:60px;
margin-bottom:20px;

}

input{

width:100%;
padding:15px;
border:none;
outline:none;
border-radius:10px;
margin-top:15px;
font-size:16px;

}

button{

margin-top:20px;
padding:15px;
width:100%;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
background:#ff3f7f;
color:white;
transition:.3s;

}

button:hover{

transform:scale(1.05);

}

#error{

margin-top:10px;
color:#ff7070;

}

#main{

display:none;
height:100vh;
overflow-y:auto;
scroll-behavior:smooth;

}

.hero{

height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(to bottom,#000,#200015);

}

.hero img{

width:280px;
height:280px;
border-radius:50%;
object-fit:cover;
box-shadow:0 0 50px hotpink;
animation:float 4s infinite;

}

.hero h1{

font-family:"Great Vibes";
font-size:70px;
margin-top:20px;

}

.hero p{

margin-top:10px;
font-size:22px;
opacity:.8;

}

@keyframes float{

50%{
transform:translateY(-20px);
}

}

.gallery{

padding:80px 20px;
text-align:center;

}

.gallery h2{

font-size:40px;
margin-bottom:40px;

}

.slider{

width:80%;
max-width:700px;
height:450px;
margin:auto;
overflow:hidden;
border-radius:20px;
box-shadow:0 0 40px hotpink;

}

.slider img{

width:100%;
height:100%;
object-fit:cover;
transition:1s;

}

.letter{

padding:80px 10%;
font-size:20px;
line-height:2;
background:#10000d;

}

#typing{

white-space:pre-wrap;

}

.final{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;

}

.final h1{

font-family:"Great Vibes";
font-size:80px;

}

.final p{

font-size:25px;
margin-top:20px;

}

.heart{

position:fixed;
color:#ff4f87;
animation:fall linear infinite;

}

@keyframes fall{

0%{

transform:translateY(-100px);

}

100%{

transform:translateY(110vh);

}

}

</style>
</head>

<body>

<div id="login">

<div class="login-box">

<h1>❤️</h1>

<h2>Private</h2>

<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Enter</button>

<p id="error"></p>

</div>

</div>

<div id="main">

<audio id="music" loop>
<source src="song.mp3">
</audio>

<section class="hero">

<img src="us1.jpg">

<h1>To My Darling ❤️</h1>

<p>Every memory reminds me of you...</p>

<button onclick="playMusic()">Play Music 🎵</button>

</section>

<section class="gallery">

<h2>Our Beautiful Memories</h2>

<div class="slider">

<img id="slide" src="us1.jpg">

</div>

</section>

<section class="letter">

<h2>I'm Sorry...</h2>

<p id="typing"></p>

</section>

<section class="final">

<h1>I Love You Forever ❤️</h1>

<p>No matter what happens, my heart will always choose you.</p>

<h2>Will you forgive me? 🌹</h2>

</section>

</div>

<script>

const PASSWORD="darling";

function login(){

if(document.getElementById("pass").value===PASSWORD){

document.getElementById("login").style.display="none";

document.getElementById("main").style.display="block";

document.body.style.overflow="auto";

type();

}

else{

document.getElementById("error").innerHTML="Wrong Password ❤️";

}

}

function playMusic(){

document.getElementById("music").play();

}

const images=[
"us1.jpg",
"us2.jpg",
"us3.jpg",
"us4.jpg"
];

let i=0;

setInterval(()=>{

i=(i+1)%images.length;

document.getElementById("slide").src=images[i];

},3500);

const text=`My Love,

I'm truly sorry.

I know I hurt you, and I wish I could go back and change that moment.

You deserve kindness, respect, patience, and love every single day.

Every smile we shared...
Every laugh...
Every little memory...

They mean everything to me.

I'm not asking you to forget what happened.

I'm only asking for one chance to prove that I can become better.

Thank you for loving me.

No matter what your decision is...

You will always have a special place in my heart.

❤️`;

let x=0;

function type(){

if(x<text.length){

document.getElementById("typing").innerHTML+=text.charAt(x);

x++;

setTimeout(type,40);

}

}

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(15+Math.random()*25)+"px";

heart.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),10000);

},300);

</script>

</body>
</html>
